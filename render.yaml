services:
  - type: web
    name: zts-hub
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    plan: free
    region: singapore
    envVars:
      - key: PROVIDER_MODE
        value: sandbox
      - key: STORE_NAME
        value: "ZTS Hub - Zesha Tech Store"
      - key: STORE_OWNER
        value: "Prince Zesha"
      - key: OWNER_WHATSAPP
        value: "6282183872081"
